name: Backend tests

on:
  push:
    paths:
      - "ReviewApp.Api/**"
      - "ReviewApp.Api.Tests/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "ReviewApp.Api/**"
      - "ReviewApp.Api.Tests/**"
      - ".github/workflows/backend-tests.yml"

# A newer push to the same branch makes the running check pointless
concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # LocalDB is Windows only; on the runner the tests use a throwaway SQL Server container instead.
    # The password only protects a container that lives for this job, so it is not a secret.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "ReviewApp-Ci-Passw0rd"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ReviewApp-Ci-Passw0rd -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      REVIEWAPP_TEST_SQL: "Server=localhost,1433;User Id=sa;Password=ReviewApp-Ci-Passw0rd;TrustServerCertificate=true"
      DOTNET_NOLOGO: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Run the backend tests
        working-directory: ReviewApp.Api
        run: >-
          dotnet test ReviewApp.Api.sln
          --configuration Release
          --settings ../ReviewApp.Api.Tests/coverage.runsettings
          --collect "XPlat Code Coverage"
          --logger "trx;LogFileName=results.trx"
          --results-directory ../TestResults

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: TestResults
          if-no-files-found: ignore
