name: Claude Code

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# One run per issue/PR at a time; don't cancel a run that is mid-implementation
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      (github.event_name == 'issues' &&
       (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
       contains(fromJson('["OWNER", "MEMBER"]'), github.event.issue.author_association)) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
       contains(fromJson('["OWNER", "MEMBER"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
       contains(fromJson('["OWNER", "MEMBER"]'), github.event.review.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
       contains(fromJson('["OWNER", "MEMBER"]'), github.event.comment.author_association))

    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on PRs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Enforced by the CLI, not just requested in a prompt
          settings: |
            {"attribution": {"commit": "", "pr": "", "sessionUrl": false}}

          claude_args: |
            --model claude-opus-5-5
            --max-turns 30
            --mcp-config .mcp.json
            --append-system-prompt "When implementing an issue, finish by opening a PR with gh pr create; the body must contain a short summary and 'Closes #<issue number>'. When handling PR feedback, push to the existing branch and never open a new PR."
            --allowedTools "Bash(git:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue comment:*),Bash(gh run view:*),Bash(npm:*),Bash(npx:*),Edit,Write,Read,Glob,Grep,LS,WebSearch,WebFetch,mcp__playwright__browser_navigate,mcp__playwright__browser_snapshot,mcp__context7__resolve-library-id,mcp__context7__query-docs"
